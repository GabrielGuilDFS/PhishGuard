services:
  db:
    image: postgres:16-alpine
    container_name: phishguard-db
    restart: unless-stopped
    # Porta derivada de POSTGRES_PORT (.env) — fonte unica; default 5433.
    command: -p ${POSTGRES_PORT:-5433}
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - phishguard-network

  backend:
    build:
      context: ./PhishGuard.Backend
      dockerfile: Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT:-5433};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AppSettings__Token: "${AppSettings__Token}"
      # 1 TÚNEL: frontend e backend compartilham o MESMO domínio público. O Vite
      # (frontend) faz reverse-proxy de /api para o backend na rede interna. Por isso
      # ambas as URLs públicas apontam para o mesmo domínio do ngrok.
      AppSettings__PublicApiBaseUrl: "https://${NGROK_DOMAIN}"
      AppSettings__PublicAppBaseUrl: "https://${NGROK_DOMAIN}"
      # Same-origin: a landing chama /api relativo (sem CORS). __0 é o domínio público;
      # __1 mantém o dev local (admin em localhost:5173 -> localhost:5000).
      AppSettings__AllowedCorsOrigins__0: "https://${NGROK_DOMAIN}"
      AppSettings__AllowedCorsOrigins__1: "http://localhost:5173"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
    depends_on:
      - db
    networks:
      - phishguard-network

  frontend:
    build:
      context: ./PhishGuard.Frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Usado pelo vite.config.ts para liberar o Host público no dev server (allowedHosts).
      NGROK_DOMAIN: "${NGROK_DOMAIN}"
    volumes:
      - ./PhishGuard.Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - phishguard-network

  # ÚNICO túnel público: aponta para o frontend, que reverte /api para o backend.
  ngrok-frontend:
    image: ngrok/ngrok:latest
    container_name: phishguard-ngrok-frontend
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN}"
    command: ["http", "frontend:5173", "--domain=${NGROK_DOMAIN}"]
    depends_on:
      - frontend
    networks:
      - phishguard-network

volumes:
  postgres-data:
  dataprotection-keys:

networks:
  phishguard-network:
    driver: bridge
