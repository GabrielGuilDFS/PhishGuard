services:
  db:
    image: postgres:16-alpine
    container_name: phishguard-db
    restart: unless-stopped
    # Porta derivada de POSTGRES_PORT (.env) — fonte unica; default 5433.
    command: -p ${POSTGRES_PORT:-5433}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - phishguard-network

  # SMTP de desenvolvimento: captura mensagens localmente, sem enviá-las à internet.
  mailpit:
    image: axllent/mailpit:latest
    container_name: phishguard-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Interface web e API
      - "127.0.0.1:1025:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - phishguard-network

  backend:
    build:
      context: .
      dockerfile: PhishGuard.Backend/Dockerfile
    container_name: phishguard-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      # Ambiente local de testes: SMTP capturado pelo Mailpit sem TLS.
      AppSettings__SmtpSecureSocketOptions: "None"
      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT:-5433};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      AppSettings__Token: "${AppSettings__Token}"
      # Auto + Development: mensagens e redirects usam localhost, via proxy Vite.
      # URLs públicas antigas no .env só são usadas se o modo for Public.
      AppSettings__TrackingUrlMode: "${AppSettings__TrackingUrlMode:-Auto}"
      AppSettings__LocalApiBaseUrl: "${AppSettings__LocalApiBaseUrl:-http://localhost:5173}"
      AppSettings__LocalAppBaseUrl: "${AppSettings__LocalAppBaseUrl:-http://localhost:5173}"
      AppSettings__PublicApiBaseUrl: "${AppSettings__PublicApiBaseUrl:-}"
      AppSettings__PublicAppBaseUrl: "${AppSettings__PublicAppBaseUrl:-}"
      AppSettings__AllowedCorsOrigins__0: "http://localhost:5173"
      AppSettings__TrustedProxies__0: "172.28.0.10"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - phishguard-network

  frontend:
    build:
      context: ./PhishGuard.Frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: "/api"
      VITE_API_PROXY_TARGET: "http://backend:5000"
    volumes:
      - ./PhishGuard.Frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      phishguard-network:
        ipv4_address: 172.28.0.10

volumes:
  postgres-data:
  dataprotection-keys:

networks:
  phishguard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
