services:
  - type: web
    runtime: docker
    name: phishguard-backend
    plan: starter
    region: oregon
    dockerfilePath: ./PhishGuard.Backend/Dockerfile
    dockerContext: ./PhishGuard.Backend
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    disk:
      name: phishguard-data-protection
      mountPath: /var/data/phishguard-keys
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: AppSettings__Token
        sync: false
      - key: AppSettings__JwtIssuer
        value: PhishGuard.Backend
      - key: AppSettings__JwtAudience
        value: PhishGuard.Frontend
      - key: AppSettings__PublicApiBaseUrl
        value: https://phishguard-backend.onrender.com
      - key: AppSettings__PublicAppBaseUrl
        value: https://phishguard-frontend.onrender.com
      - key: AppSettings__AllowedCorsOrigins__0
        value: https://phishguard-frontend.onrender.com
      - key: AppSettings__TrustPlatformProxy
        value: "true"
      - key: AppSettings__CrossSiteRefreshCookie
        value: "true"
      - key: DataProtection__KeysPath
        value: /var/data/phishguard-keys
      - key: Dashboard__TimeZoneId
        value: America/Sao_Paulo

  - type: web
    runtime: static
    name: phishguard-frontend
    rootDir: PhishGuard.Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://phishguard-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://phishguard-backend.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: phishguard-db
    plan: free
    region: oregon
    databaseName: phishguard
    user: phishguard
    postgresMajorVersion: "16"
    ipAllowList: []
