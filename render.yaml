services:
  - type: web
    runtime: docker
    name: phishguard-backend
    plan: free
    region: ohio
    dockerfilePath: ./PhishGuard.Backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: postgres
          property: connectionString
      - key: AppSettings__Token
        sync: false
      - key: AppSettings__JwtIssuer
        value: PhishGuard.Backend
      - key: AppSettings__JwtAudience
        value: PhishGuard.Frontend
      - key: AppSettings__PublicApiBaseUrl
        value: https://phishguard-backend-rcbr.onrender.com
      - key: AppSettings__PublicAppBaseUrl
        value: https://phishguard-frontend-ty8k.onrender.com
      - key: AppSettings__AllowedCorsOrigins__0
        value: https://phishguard-frontend-ty8k.onrender.com
      - key: AppSettings__TrustPlatformProxy
        value: "true"
      - key: AppSettings__CrossSiteRefreshCookie
        value: "true"
      # Instancias gratuitas do Render bloqueiam egress SMTP nas portas 25/465/587.
      # Ao migrar para um plano pago, altere para true e sincronize o Blueprint.
      - key: AppSettings__SmtpTransportEnabled
        value: "false"
      - key: AppSettings__SmtpTransportDisabledReason
        value: O plano gratuito do Render bloqueia conexoes SMTP nas portas 25, 465 e 587. Use um plano pago ou um provedor por API HTTPS.
      - key: Dashboard__TimeZoneId
        value: America/Sao_Paulo

  - type: web
    runtime: static
    name: phishguard-frontend
    rootDir: PhishGuard.Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://phishguard-backend-rcbr.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://phishguard-backend-rcbr.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: postgres
    plan: free
    region: ohio
    ipAllowList: []
