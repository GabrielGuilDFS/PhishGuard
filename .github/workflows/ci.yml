name: PhishGuard CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Cancela execucoes antigas da mesma ref quando um novo commit chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # BACKEND (.NET 8) — build Release + testes xUnit
  # ---------------------------------------------------------------------------
  backend:
    name: Build & Test Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore PhishGuard.Backend/PhishGuard.Backend.csproj

      - name: Compilar (Release)
        run: dotnet build PhishGuard.Backend/PhishGuard.Backend.csproj --configuration Release --no-restore

      - name: Executar testes + gate de cobertura (xUnit + coverlet)
        run: dotnet test PhishGuard.Tests/PhishGuard.Tests.csproj --configuration Release -p:CollectCoverage=true

  # ---------------------------------------------------------------------------
  # FRONTEND (React / TS) — lint + typecheck + testes + build
  # ---------------------------------------------------------------------------
  frontend:
    name: Build, Lint & Test Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PhishGuard.Frontend
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: PhishGuard.Frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Gate BLOQUEANTE: a divida de lint pre-existente (25 erros) foi zerada no Passo 2.5.
      - name: Lint (ESLint)
        run: npm run lint

      # tsc -b (build mode) e o UNICO que percorre as project references, incluindo
      # o tsconfig.test.json — checa os *.test.tsx junto do codigo de producao.
      - name: Checagem estatica de tipos (tsc -b)
        run: npx tsc -b

      - name: Executar testes + gate de cobertura (Vitest v8)
        run: npm run test:ci

      - name: Compilar (build de producao)
        run: npm run build

  # ---------------------------------------------------------------------------
  # E2E — Playwright + Mailpit (Passo 13). Sobe a stack de homologacao
  # (docker-compose.e2e.yml: db + backend + frontend + mailpit) e roda o ciclo de
  # vida completo de uma campanha (§2.1). SMTP capturado pelo Mailpit + allowlist
  # @test.io: nada sai para a internet.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright + Mailpit)
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Subir a stack de homologacao (db + backend + frontend + mailpit)
        run: docker compose -f docker-compose.e2e.yml --env-file .env.e2e up -d --build

      - name: Instalar dependencias E2E + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Aguardar o app responder
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health/ready >/dev/null \
              && curl -sf http://localhost:5173 >/dev/null; then
              echo "API pronta e frontend de pe"
              exit 0
            fi
            sleep 3
          done
          echo "API/frontend nao ficaram prontos a tempo" && exit 1

      - name: Rodar Playwright (ciclo de vida da campanha)
        working-directory: e2e
        run: npx playwright test
        env:
          CI: "true"

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=200

      - name: Publicar relatorio do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml --env-file .env.e2e down -v

  # ---------------------------------------------------------------------------
  # SECURITY — audit de dependencias (Passo 11: DevSecOps basico). CodeQL entra no
  # Passo 15. Os audits rodam como VISIBILIDADE (continue-on-error): hoje ambos
  # reportam highs em dependencias TRANSITIVAS (dev-tooling do frontend: vite,
  # rollup, postcss, react-router, brace-expansion via @vitest/coverage-v8; e no
  # backend: System.Text.Json/Npgsql/Caching.Memory 8.0.0). Quem REMEDIA essa divida
  # e o Dependabot (.github/dependabot.yml, PRs semanais nuget+npm). Promover a gate
  # bloqueante (remover os continue-on-error) so DEPOIS que os bumps do Dependabot
  # zerarem o baseline — do contrario a CI quebra no 1o run sem ganho de seguranca.
  # ---------------------------------------------------------------------------
  security:
    name: Security (audit de dependencias)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: PhishGuard.Frontend/package-lock.json

      - name: Configurar .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Precisa das dev-deps instaladas para o audit enxergar a arvore transitiva.
      - name: Instalar dependencias (frontend)
        working-directory: PhishGuard.Frontend
        run: npm ci

      - name: npm audit (frontend)
        working-directory: PhishGuard.Frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: dotnet list --vulnerable (backend + testes)
        # dotnet list --vulnerable retorna exit 0 mesmo com vulnerabilidades: a solution
        # inteira (Backend + Tests) e varrida so para imprimir o relatorio no log da CI.
        run: |
          dotnet restore PhishGuard.sln
          dotnet list PhishGuard.sln package --vulnerable --include-transitive
        continue-on-error: true
