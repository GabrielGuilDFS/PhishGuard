# Dependabot — MODO DEFENSIVO (ajustado para a reta final do TCC).
#
# Objetivo: manter a `main` limpa e o repositorio sem poluicao de PRs falhos diante da
# banca, SEM abrir mao de resposta a vulnerabilidades. Duas alavancas:
#
#   1) `interval: "monthly"`         -> cadencia baixa (era semanal): menos ruido.
#   2) `open-pull-requests-limit: 1` -> no maximo 1 PR de VERSAO aberto por ecossistema.
#   3) grupo unico por ecossistema   -> se vier bump, vem consolidado num PR so (menos
#                                       conflito de lockfile, menos "1/4 checks failed").
#
# >>> MODO "SO SEGURANCA" (recomendado ate a entrega) <<<
# Troque `open-pull-requests-limit` para 0. Isso DESLIGA os PRs de versao (cosmeticos),
# mas os PRs de SEGURANCA (GitHub Security Advisories) CONTINUAM sendo abertos — exige
# "Dependabot security updates" ligado em Settings > Code security. Para um TCC cujo tema
# e seguranca, esse e o melhor equilibrio: zero ruido, mas nenhuma CVE passa batido.
version: 2
updates:
  # ---------------------------------------------------------------------------
  # BACKEND (.NET / NuGet) — a partir da raiz, o Dependabot descobre a solution
  # (PhishGuard.sln) e ambos os projetos (PhishGuard.Backend + PhishGuard.Tests).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Grupo unico: TODO bump de backend cai num PR consolidado — nunca mais bumps
      # parciais inconsistentes (foi o que quebrou o grupo EF9: subiu EF Core mas
      # esqueceu o Sqlite, gerando TypeLoadException entre EF8 x EF9).
      backend-all:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # FRONTEND (npm) — usa o package-lock.json de PhishGuard.Frontend/.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/PhishGuard.Frontend"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Grupo unico: TODO bump de frontend num PR so (react, mui, vite/vitest, tipos).
      frontend-all:
        patterns:
          - "*"
